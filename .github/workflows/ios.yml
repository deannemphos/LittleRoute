name: iOS Build and Test

on:
  push:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test LittleRoute
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          devices = json.loads((Path(os.environ["RUNNER_TEMP"]) / "simulators.json").read_text())["devices"]
          candidates = []
          for runtime, entries in devices.items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.rsplit(".iOS-", 1)[1].split("-"))
              for device in entries:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator runtime is installed.")
          version, name, udid = max(candidates)
          print(f"Using {name}, iOS {'.'.join(map(str, version))}, {udid}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"destination=platform=iOS Simulator,id={udid}\n")
          PY
      - name: Build
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          mkdir -p LittleRoute/Music
          xcodebuild build-for-testing \
            -project LittleRoute.xcodeproj \
            -scheme LittleRoute \
            -destination "$DESTINATION" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Test
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          xcodebuild test-without-building \
            -project LittleRoute.xcodeproj \
            -scheme LittleRoute \
            -destination "$DESTINATION" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results
          path: TestResults.xcresult
          if-no-files-found: warn
